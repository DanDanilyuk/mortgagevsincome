name: Weekly Case-Shiller Update

on:
  schedule:
    # Weekly: Freddie Mac publishes the mortgage rate Thursdays at noon ET.
    - cron: '10 12 * * 4'
      timezone: 'America/New_York'
    # Monthly: BLS publishes at 8:30 ET and FRED has had it by about 9:30. Zillow lands
    # overnight mid-month. These dates vary, so check every weekday; upstream_check.rb
    # skips the run unless FRED reports something new, which also retries a late rate.
    - cron: '40 9 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write # Required to commit and push changes

concurrency:
  group: weekly-case-shiller
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Skip unless upstream has new data
        id: skip_check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: ruby upstream_check.rb

      - name: Run unit tests
        if: steps.skip_check.outputs.skip != 'true'
        run: bundle exec ruby test/all.rb

      - name: Run weekly Case-Shiller script (national + all states)
        if: steps.skip_check.outputs.skip != 'true'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: 'America/New_York'
        run: |
          ruby weekly_case_shiller.rb --bls-api-key $BLS_API_KEY --fred-api-key $FRED_API_KEY

      - name: Set up Node (for schema validation)
        if: steps.skip_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON against schema
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          # Per-state files + the national file validate against the per-state schema.
          # "data/??.json" matches the 51 two-character state codes (AL, AK, ... DC) and excludes
          # data/index.json, a roll-up with a different shape that has its own schema below.
          # (ajv-cli's glob accepts "??" but not "[A-Z][A-Z]" character classes.)
          npx --yes ajv-cli@5 validate -s schema/state_data.schema.json -d "data/??.json" -d "weekly_case_shiller_output.json" --strict=false
          npx --yes ajv-cli@5 validate -s schema/state_index.schema.json -d "data/index.json" --strict=false

      - name: Check freshness of generated JSON files
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          ruby -rjson -rtime -e '
            threshold = Time.now - 8 * 86400
            stale = []
            Dir.glob(["weekly_case_shiller_output.json", "data/*.json"]).each do |f|
              d = JSON.parse(File.read(f))
              # State/national files carry metadata.generated_at; data/index.json carries it top-level.
              ts = d.dig("metadata", "generated_at") || d["generated_at"]
              if ts.nil? || ts.empty?
                stale << "#{f}: missing generated_at"
              elsif Time.parse(ts) < threshold
                stale << "#{f}: stale (generated_at: #{ts})"
              end
            end
            if stale.any?
              stale.each { |msg| puts "ERROR: #{msg}" }
              exit 1
            end
            puts "✅ All JSON files are fresh (within 8 days)"
          '

      - name: Determine data week
        if: steps.skip_check.outputs.skip != 'true'
        id: week
        run: echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated JSON
        if: steps.skip_check.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update affordability data for week of ${{ steps.week.outputs.date }}'
          file_pattern: '*.json data/*.json'
